<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Intelligence — AI-Powered Recruitment Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+Pro:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="smooth-scroll">
    <header class="topbar">
        <div class="topbar-left">
            <span class="wordmark">Résumé Intelligence</span>
            <span class="case-tag">AI-Powered Recruitment</span>
        </div>
        <div class="topbar-right" id="statusLine">connecting to model…</div>
        <div class="auth-buttons">
            <a href="login.html" class="btn-ghost btn-small">Login</a>
            <a href="signup.html" class="btn-primary btn-small">Sign Up</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="shell">
        <!-- Minimal hero section with just project name -->
        <section class="section hero-section" id="hero">
            <div class="section-content">
                <h1>AI-Powered <span class="text-gradient">Recruitment Intelligence</span></h1>
                <p class="hero-subtitle">Multimodal Smart Recruitment & Resume Intelligence Platform</p>
            </div>
        </section>
    </main>
</div>

<!-- Candidate detail drawer -->
<div id="drawerOverlay" class="drawer-overlay" hidden>
    <div id="drawer" class="drawer" role="dialog" aria-modal="true">
        <button id="drawerClose" class="drawer-close" aria-label="Close">×</button>
        <div id="drawerContent"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
